
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM Persediaan Farmasi - RSAL Kodaeral XIV</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy: #123b65;
      --blue: #1769aa;
      --light: #f3f6fa;
      --white: #ffffff;
      --text: #243247;
      --muted: #718096;
      --border: #e3e9f0;
      --green: #16845b;
      --red: #c43d3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: var(--text);
    }

    button, input { font: inherit; }

    /* LOGIN */
    #loginPanel {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #edf2f7;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 35px #102b461c;
    }

    .login-logo {
      width: 55px;
      height: 55px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: white;
      border-radius: 12px;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .login-card h2 { margin: 0 0 8px; color: var(--navy); }
    .login-card p { color: var(--muted); font-size: 14px; }

    .login-card label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: bold;
    }

    .login-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline-color: var(--blue);
    }

    .primary-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--navy);
      font-weight: bold;
      cursor: pointer;
    }

    .primary-btn:disabled { opacity: .6; cursor: wait; }

    #loginMessage {
      color: var(--red);
      font-size: 13px;
      line-height: 1.5;
    }

    /* APPLICATION */
    #app { display: none; min-height: 100vh; }

    .topbar {
      height: 66px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-weight: bold;
      color: var(--navy);
      font-size: 17px;
    }

    .brand small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: normal;
      margin-top: 4px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .role {
      background: #e7f0fa;
      color: var(--navy);
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .logout-btn {
      border: 1px solid var(--border);
      background: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .layout { display: flex; min-height: calc(100vh - 66px); }

    .sidebar {
      width: 235px;
      flex-shrink: 0;
      background: var(--navy);
      padding: 22px 12px;
      color: white;
    }

    .sidebar-title {
      color: #a9c5df;
      font-size: 11px;
      padding: 10px 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-btn {
      width: 100%;
      display: block;
      padding: 12px;
      margin-bottom: 5px;
      border: 0;
      border-radius: 7px;
      color: #dce8f3;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: #ffffff20;
      color: white;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 28px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 24px;
      color: var(--navy);
    }

    .page-heading p {
      color: var(--muted);
      margin: 7px 0 0;
      font-size: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .stat-card .label {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-card .number {
      font-size: 28px;
      font-weight: bold;
      color: var(--navy);
      margin-top: 12px;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .panel h3 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: 16px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 550px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--muted);
      background: #f8fafc;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      background: #e6f5ee;
      color: var(--green);
      border-radius: 20px;
      font-size: 11px;
    }

    .notice {
      padding: 14px;
      border-radius: 8px;
      background: #fff8e6;
      color: #8a641b;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .muted { color: var(--muted); font-size: 13px; }

    .refresh-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 7px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: var(--muted);
    }

    @media(max-width: 900px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sidebar { width: 195px; }
    }

    @media(max-width: 650px) {
      .topbar { padding: 0 12px; }
      .brand { font-size: 14px; }
      .user-area { gap: 6px; }
      .user-name { display: none; }
      .layout { display: block; }
      .sidebar {
        width: 100%;
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }
      .sidebar-title { display: none; }
      .nav-btn {
        width: auto;
        white-space: nowrap;
        margin: 0 3px;
        padding: 10px;
      }
      main { padding: 17px; }
      .cards { gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-card .number { font-size: 23px; }
      .page-heading h1 { font-size: 20px; }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPanel">
  <div class="login-card">
    <div class="login-logo">SF</div>
    <h2>SIM Persediaan Farmasi</h2>
    <p>Klinik RSAL Kodaeral XIV</p>

    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email"
        placeholder="Masukkan email" required>

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password"
        placeholder="Masukkan password" required>

      <button class="primary-btn" id="loginButton" type="submit">
        LOGIN
      </button>
    </form>

    <div id="loginMessage" role="alert"></div>
  </div>
</div>

<!-- APPLICATION -->
<div id="app">

  <header class="topbar">
    <div class="brand">
      SIM PERSEDIAAN FARMASI
      <small>KLINIK RSAL KODAERAL XIV</small>
    </div>

    <div class="user-area">
      <span class="user-name" id="userName"></span>
      <span class="role" id="userRole"></span>
      <button class="logout-btn" id="logoutButton">Logout</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-title">Menu Utama</div>

      <button class="nav-btn active" data-page="dashboard">
        ▦ Dashboard
      </button>

      <button class="nav-btn" data-page="items">
        ▤ Master Barang
      </button>

      <button class="nav-btn" data-page="batches">
        ▣ Stok per Batch
      </button>

      <div class="sidebar-title">Transaksi</div>

      <button class="nav-btn" data-page="receipts">
        ↓ Penerimaan
      </button>

      <button class="nav-btn" data-page="issues">
        ↑ Pengeluaran
      </button>

      <button class="nav-btn" data-page="recap">
        ▤ Rekap Pengeluaran
      </button>

      <button class="nav-btn" data-page="cards">
        ▧ Kartu Stok
      </button>

      <button class="nav-btn" data-page="stocktake">
        ☑ Stok Opname
      </button>

      <div class="sidebar-title">Sistem</div>

      <button class="nav-btn" data-page="settings">
        ⚙ Pengaturan
      </button>
    </aside>

    <main>
      <div id="pageContent"></div>
    </main>

  </div>
</div>

<script>
/* =========================================
   KONFIGURASI SUPABASE
   GANTI DENGAN DATA PROYEK ANDA
========================================= */

const SUPABASE_URL = "https://janxyyhnbsrplcepyrgb.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_sb6G7BjiUIseKwUeg3gtIA_11vdxJoO";

/* =========================================
   INISIALISASI
========================================= */

const loginPanel = document.getElementById("loginPanel");
const loginMessage = document.getElementById("loginMessage");
const loginButton = document.getElementById("loginButton");
const app = document.getElementById("app");
const pageContent = document.getElementById("pageContent");

let supabaseClient = null;
let currentProfile = null;
let itemsData = [];
let batchesData = [];

/* =========================================
   VALIDASI DAN KONEKSI
========================================= */

function initializeSupabase() {
  if (
    SUPABASE_URL.includes("MASUKKAN_") ||
    SUPABASE_KEY.includes("MASUKKAN_")
  ) {
    loginMessage.textContent =
      "Konfigurasi Supabase belum diisi pada index.html.";
    return false;
  }

  try {
    const url = new URL(SUPABASE_URL);

    if (
      url.protocol !== "https:" ||
      !url.hostname.endsWith(".supabase.co") ||
      url.pathname !== "/"
    ) {
      loginMessage.textContent =
        "Project URL tidak valid. Periksa Settings > API di Supabase.";
      return false;
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL.replace(/\/+$/, ""),
      SUPABASE_KEY
    );

    return true;
  } catch (error) {
    loginMessage.textContent = "Project URL tidak valid.";
    return false;
  }
}

/* =========================================
   LOGIN
========================================= */

document.getElementById("loginForm").addEventListener(
  "submit",
  async function(event) {
    event.preventDefault();

    if (!supabaseClient) return;

    const email = document.getElementById("loginEmail")
      .value.trim();

    const password = document.getElementById("loginPassword")
      .value;

    loginMessage.textContent = "";
    loginButton.disabled = true;
    loginButton.textContent = "Memproses...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      loginMessage.textContent =
        "Login gagal: " + error.message;

      loginButton.disabled = false;
      loginButton.textContent = "LOGIN";
      return;
    }

    await loadUserProfile(data.user);
  }
);

/* =========================================
   PROFIL PENGGUNA
========================================= */

async function loadUserProfile(user) {
  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("full_name, role")
    .eq("id", user.id)
    .single();

  if (error || !profile) {
    loginMessage.textContent =
      "Profil pengguna tidak ditemukan atau tidak dapat dibaca. Hubungi Admin.";

    await supabaseClient.auth.signOut();

    loginButton.disabled = false;
    loginButton.textContent = "LOGIN";
    return;
  }

  currentProfile = profile;

  document.getElementById("userName").textContent =
    profile.full_name || user.email;

  document.getElementById("userRole").textContent =
    (profile.role || "staff").toUpperCase();

  loginPanel.style.display = "none";
  app.style.display = "block";

  await loadDashboardData();
  showPage("dashboard");
}

/* =========================================
   PEMBACAAN DATA
========================================= */

async function loadDashboardData() {
  pageContent.innerHTML =
    '<div class="empty">Memuat data dari Supabase...</div>';

  const [itemsResult, batchesResult] = await Promise.all([
    supabaseClient.from("items").select("*"),
    supabaseClient.from("stock_batches").select("*")
  ]);

  if (itemsResult.error || batchesResult.error) {
    const err = itemsResult.error || batchesResult.error;

    pageContent.innerHTML = `
      <div class="panel">
        <h3>Gagal membaca data</h3>
        <p class="muted">${escapeHTML(err.message)}</p>
        <button class="refresh-btn" onclick="loadDashboardData()">
          Coba Lagi
        </button>
      </div>
    `;
    return;
  }

  itemsData = itemsResult.data || [];
  batchesData = batchesResult.data || [];
}

/* =========================================
   FORMAT DAN KEAMANAN TAMPILAN
========================================= */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString("id-ID");
}

function getItemName(item) {
  return item.name || item.item_name ||
    item.nama_barang || item.description ||
    item.code || item.id || "-";
}

function getQuantity(batch) {
  return Number(
    batch.quantity ??
    batch.qty ??
    batch.stock ??
    batch.balance ??
    0
  );
}

/* =========================================
   DASHBOARD
========================================= */

function renderDashboard() {
  const totalItems = itemsData.length;
  const totalBatches = batchesData.length;

  const totalStock = batchesData.reduce(
    (sum, batch) => sum + getQuantity(batch), 0
  );

  pageContent.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Dashboard</h1>
        <p>Ringkasan persediaan farmasi</p>
      </div>
      <button class="refresh-btn" onclick="refreshData()">
        ↻ Refresh Data
      </button>
    </div>

    <div class="notice">
      Data ditampilkan berdasarkan tabel Supabase yang dapat
      diakses oleh akun Anda. Fitur transaksi belum diaktifkan.
    </div>

    <div class="cards">
      <div class="stat-card">
        <div class="label">Jumlah Master Barang</div>
        <div class="number">${formatNumber(totalItems)}</div>
      </div>

      <div class="stat-card">
        <div class="label">Jumlah Batch</div>
        <div class="number">${formatNumber(totalBatches)}</div>
      </div>

      <div class="stat-card">
        <div class="label">Total Kuantitas Batch</div>
        <div class="number">${formatNumber(totalStock)}</div>
      </div>

      <div class="stat-card">
        <div class="label">Status Sistem</div>
        <div class="number" style="font-size:20px;color:var(--green)">
          Terhubung
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Status Koneksi Database</h3>
      <p><span class="status">Terhubung ke Supabase</span></p>
      <p class="muted">
        Login: ${escapeHTML(currentProfile?.full_name || "-")}
      </p>
      <p class="muted">
        Role: ${escapeHTML(currentProfile?.role || "-")}
      </p>
    </div>

    <div class="panel">
      <h3>Master Barang Terbaru</h3>
      ${renderItemsTable(itemsData.slice(0, 10))}
    </div>
  `;
}

/* =========================================
   MASTER BARANG
========================================= */

function renderItemsTable(data) {
  if (!data.length) {
    return '<div class="empty">Belum ada data barang.</div>';
  }

  const columns = Object.keys(data[0]).slice(0, 6);

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            ${columns.map(col =>
              `<th>${escapeHTML(col)}</th>`
            ).join("")}
          </tr>
        </thead>
        <tbody>
          ${data.map(row => `
            <tr>
              ${columns.map(col =>
                `<td>${escapeHTML(row[col])}</td>`
              ).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* =========================================
   MASTER BARANG - TAMBAH, UBAH, CARI
========================================= */

let editingItemId = null;

function renderItems() {
  const isAdmin = currentProfile?.role === "admin";

  pageContent.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Master Barang</h1>
        <p>Pengelolaan data master persediaan farmasi</p>
      </div>
      <button class="refresh-btn" id="refreshItems">↻ Refresh</button>
    </div>

    ${isAdmin ? `
      <div class="panel">
        <h3 id="itemFormTitle">Tambah Barang Baru</h3>

        <form id="itemForm">
          <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            <div>
              <label>Kode Barang</label>
              <input id="itemCode" required maxlength="50"
                placeholder="Contoh: OB001"
                style="width:100%;padding:11px;border:1px solid var(--border);border-radius:7px">
            </div>

            <div>
              <label>Nama Barang</label>
              <input id="itemName" required maxlength="200"
                placeholder="Nama obat atau alat kesehatan"
                style="width:100%;padding:11px;border:1px solid var(--border);border-radius:7px">
            </div>

            <div>
              <label>Kategori</label>
              <input id="itemCategory" maxlength="100"
                placeholder="Contoh: Obat"
                style="width:100%;padding:11px;border:1px solid var(--border);border-radius:7px">
            </div>

            <div>
              <label>Satuan</label>
              <input id="itemUnit" required maxlength="30"
                placeholder="Contoh: Tablet, Botol, Box"
                style="width:100%;padding:11px;border:1px solid var(--border);border-radius:7px">
            </div>

            <div>
              <label>Stok Minimum</label>
              <input id="itemMinimum" type="number" min="0" step="0.01"
                value="0" required
                style="width:100%;padding:11px;border:1px solid var(--border);border-radius:7px">
            </div>
          </div>

          <button class="primary-btn" id="saveItemButton"
            type="submit" style="max-width:220px">
            Simpan Barang
          </button>

          <button type="button" class="refresh-btn"
            id="cancelItemEdit" style="display:none">
            Batal Ubah
          </button>

          <p id="itemMessage" class="muted"></p>
        </form>
      </div>
    ` : `
      <div class="notice">
        Akun Staff hanya dapat melihat data Master Barang.
        Penambahan dan perubahan data hanya dapat dilakukan Admin.
      </div>
    `}

    <div class="panel">
      <h3>Daftar Barang (${itemsData.length})</h3>

      <input id="itemSearch" type="search"
        placeholder="Cari kode atau nama barang..."
        style="width:100%;max-width:400px;padding:11px;margin-bottom:15px;border:1px solid var(--border);border-radius:7px">

      <div id="itemsTable"></div>
    </div>
  `;

  document.getElementById("refreshItems").addEventListener(
    "click", refreshData
  );

  renderItemsTableWithActions(itemsData);

  document.getElementById("itemSearch").addEventListener(
    "input", function() {
      const keyword = this.value.toLowerCase();

      const filtered = itemsData.filter(item =>
        String(item.item_code || "").toLowerCase().includes(keyword) ||
        String(item.item_name || "").toLowerCase().includes(keyword) ||
        String(item.category || "").toLowerCase().includes(keyword)
      );

      renderItemsTableWithActions(filtered);
    }
  );

  if (isAdmin) {
    document.getElementById("itemForm").addEventListener(
      "submit", saveItem
    );

    document.getElementById("cancelItemEdit").addEventListener(
      "click", resetItemForm
    );
  }
}

function renderItemsTableWithActions(data) {
  const isAdmin = currentProfile?.role === "admin";
  const container = document.getElementById("itemsTable");

  if (!container) return;

  if (!data.length) {
    container.innerHTML =
      '<div class="empty">Belum ada data barang yang sesuai.</div>';
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Kode</th>
            <th>Nama Barang</th>
            <th>Kategori</th>
            <th>Satuan</th>
            <th>Stok Minimum</th>
            <th>Status</th>
            ${isAdmin ? "<th>Aksi</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${data.map(item => `
            <tr>
              <td>${escapeHTML(item.item_code)}</td>
              <td>${escapeHTML(item.item_name)}</td>
              <td>${escapeHTML(item.category || "-")}</td>
              <td>${escapeHTML(item.unit)}</td>
              <td>${formatNumber(item.minimum_stock)}</td>
              <td>
                ${item.is_active
                  ? '<span class="status">Aktif</span>'
                  : '<span class="status" style="background:#fce8e8;color:#a22">Nonaktif</span>'}
              </td>
              ${isAdmin ? `
                <td>
                  <button class="refresh-btn"
                    data-edit-item="${escapeHTML(item.id)}">
                    Ubah
                  </button>
                  <button class="refresh-btn"
                    data-toggle-item="${escapeHTML(item.id)}">
                    ${item.is_active ? "Nonaktifkan" : "Aktifkan"}
                  </button>
                </td>
              ` : ""}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  container.querySelectorAll("[data-edit-item]").forEach(button => {
    button.addEventListener("click", () => {
      editItem(button.dataset.editItem);
    });
  });

  container.querySelectorAll("[data-toggle-item]").forEach(button => {
    button.addEventListener("click", () => {
      toggleItem(button.dataset.toggleItem);
    });
  });
}

async function saveItem(event) {
  event.preventDefault();

  if (currentProfile?.role !== "admin") {
    alert("Hanya Admin yang dapat mengubah Master Barang.");
    return;
  }

  const button = document.getElementById("saveItemButton");
  const message = document.getElementById("itemMessage");

  const item = {
    item_code: document.getElementById("itemCode").value.trim(),
    item_name: document.getElementById("itemName").value.trim(),
    category: document.getElementById("itemCategory").value.trim() || null,
    unit: document.getElementById("itemUnit").value.trim(),
    minimum_stock: Number(document.getElementById("itemMinimum").value),
  };

  if (!item.item_code || !item.item_name || !item.unit) {
    message.textContent = "Kode, nama, dan satuan wajib diisi.";
    return;
  }

  if (!Number.isFinite(item.minimum_stock) || item.minimum_stock < 0) {
    message.textContent = "Stok minimum harus berupa angka nol atau lebih.";
    return;
  }

  button.disabled = true;
  button.textContent = "Menyimpan...";
  message.textContent = "";

  let result;

  if (editingItemId) {
    result = await supabaseClient
      .from("items")
      .update(item)
      .eq("id", editingItemId);
  } else {
    result = await supabaseClient
      .from("items")
      .insert(item);
  }

  if (result.error) {
    message.textContent = "Gagal menyimpan: " + result.error.message;
    button.disabled = false;
    button.textContent = editingItemId ? "Simpan Perubahan" : "Simpan Barang";
    return;
  }

  alert(editingItemId
    ? "Perubahan barang berhasil disimpan."
    : "Barang baru berhasil ditambahkan.");

  editingItemId = null;
  await loadDashboardData();
  showPage("items");
}

function editItem(id) {
  const item = itemsData.find(row => row.id === id);

  if (!item) return;

  editingItemId = id;

  document.getElementById("itemCode").value = item.item_code || "";
  document.getElementById("itemName").value = item.item_name || "";
  document.getElementById("itemCategory").value = item.category || "";
  document.getElementById("itemUnit").value = item.unit || "";
  document.getElementById("itemMinimum").value = item.minimum_stock || 0;

  document.getElementById("itemFormTitle").textContent = "Ubah Data Barang";
  document.getElementById("saveItemButton").textContent = "Simpan Perubahan";
  document.getElementById("cancelItemEdit").style.display = "inline-block";

  document.getElementById("itemForm").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function resetItemForm() {
  editingItemId = null;

  document.getElementById("itemForm").reset();
  document.getElementById("itemMinimum").value = 0;
  document.getElementById("itemFormTitle").textContent = "Tambah Barang Baru";
  document.getElementById("saveItemButton").textContent = "Simpan Barang";
  document.getElementById("cancelItemEdit").style.display = "none";
  document.getElementById("itemMessage").textContent = "";
}

async function toggleItem(id) {
  if (currentProfile?.role !== "admin") return;

  const item = itemsData.find(row => row.id === id);
  if (!item) return;

  const nextStatus = !item.is_active;

  if (!confirm(
    `Yakin ingin ${nextStatus ? "mengaktifkan" : "menonaktifkan"} ${item.item_name}?`
  )) return;

  const { error } = await supabaseClient
    .from("items")
    .update({ is_active: nextStatus })
    .eq("id", id);

  if (error) {
    alert("Gagal mengubah status: " + error.message);
    return;
  }

  await loadDashboardData();
  showPage("items");
}

/* =========================================
   STOK PER BATCH
========================================= */

function renderBatches() {
  pageContent.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Stok per Batch</h1>
        <p>Data batch persediaan dari Supabase</p>
      </div>
      <button class="refresh-btn" onclick="refreshData()">
        ↻ Refresh
      </button>
    </div>

    <div class="panel">
      <h3>Daftar Batch (${batchesData.length})</h3>
      ${renderItemsTable(batchesData)}
    </div>
  `;
}

/* =========================================
   MENU PERSIAPAN
========================================= */

const futurePages = {
  receipts: {
    title: "Penerimaan Barang",
    description: "Pencatatan penerimaan barang dari pemasok."
  },
  issues: {
    title: "Pengeluaran Barang",
    description: "Pencatatan pengeluaran dan distribusi barang."
  },
  recap: {
    title: "Rekap Pengeluaran",
    description: "Laporan pengeluaran berdasarkan periode."
  },
  cards: {
    title: "Kartu Stok",
    description: "Riwayat mutasi masuk, keluar, dan saldo stok."
  },
  stocktake: {
    title: "Stok Opname",
    description: "Pencocokan stok fisik dengan stok sistem."
  },
  settings: {
    title: "Pengaturan",
    description: "Pengaturan akun dan sistem."
  }
};

function renderFuturePage(page) {
  const config = futurePages[page];

  pageContent.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>${config.title}</h1>
        <p>${config.description}</p>
      </div>
    </div>

    <div class="notice">
      Modul ini masih dalam tahap pengembangan.
      Belum tersedia pencatatan atau perubahan transaksi.
    </div>

    <div class="panel">
      <h3>${config.title}</h3>
      <div class="empty">
        Fitur akan diaktifkan setelah koneksi database,
        hak akses, dan alur transaksi selesai disiapkan.
      </div>
    </div>
  `;
}

/* =========================================
   NAVIGASI
========================================= */

function showPage(page) {
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  if (page === "dashboard") renderDashboard();
  else if (page === "items") renderItems();
  else if (page === "batches") renderBatches();
  else if (futurePages[page]) renderFuturePage(page);
}

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => {
    showPage(button.dataset.page);
  });
});

/* =========================================
   REFRESH
========================================= */

async function refreshData() {
  await loadDashboardData();

  if (pageContent.innerHTML.includes("Gagal membaca data")) {
    return;
  }

  const activePage = document.querySelector(
    ".nav-btn.active"
  )?.dataset.page || "dashboard";

  showPage(activePage);
}

/* =========================================
   LOGOUT DAN PEMERIKSAAN SESI
========================================= */

document.getElementById("logoutButton").addEventListener(
  "click",
  async function() {
    await supabaseClient.auth.signOut();
    location.reload();
  }
);

async function checkSession() {
  if (!initializeSupabase()) return;

  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    loginMessage.textContent = error.message;
    return;
  }

  if (data.session) {
    await loadUserProfile(data.session.user);
  }
}

checkSession();

</script>
