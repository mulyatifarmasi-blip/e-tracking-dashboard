<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM Persediaan Farmasi - RSAL Kodaeral XIV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#123b65;--blue:#1769aa;--bg:#f3f6fa;--white:#fff;--text:#243247;--muted:#718096;--border:#e3e9f0;--green:#16845b;--red:#c43d3d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
#loginPanel{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:#edf2f7}
.login-card{width:100%;max-width:400px;padding:32px;background:white;border-radius:16px;box-shadow:0 10px 35px #102b461c}
.login-logo{width:55px;height:55px;display:grid;place-items:center;background:var(--navy);color:white;border-radius:12px;font-size:25px;font-weight:bold;margin-bottom:20px}
.login-card h2{margin:0 0 8px;color:var(--navy)}.login-card p{color:var(--muted);font-size:14px}
.login-card label{display:block;margin:16px 0 7px;font-size:13px;font-weight:bold}
.login-card input{width:100%;padding:13px;border:1px solid var(--border);border-radius:8px;outline-color:var(--blue)}
.primary-btn{padding:12px 18px;background:var(--navy);color:white;border:0;border-radius:8px;font-weight:bold}
.login-card .primary-btn{width:100%;margin-top:20px}.primary-btn:disabled{opacity:.6;cursor:wait}
#loginMessage{color:var(--red);font-size:13px;line-height:1.5}
#app{display:none;min-height:100vh}.topbar{height:66px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{font-weight:bold;color:var(--navy);font-size:17px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:normal;margin-top:4px}
.user-area{display:flex;align-items:center;gap:12px;font-size:13px}.role{background:#e7f0fa;color:var(--navy);padding:6px 10px;border-radius:20px;font-weight:bold}
.logout-btn,.refresh-btn{border:1px solid var(--border);background:white;padding:8px 12px;border-radius:7px}
.layout{display:flex;min-height:calc(100vh - 66px)}.sidebar{width:235px;flex-shrink:0;background:var(--navy);padding:22px 12px;color:white}
.sidebar-title{color:#a9c5df;font-size:11px;padding:10px 12px;text-transform:uppercase;letter-spacing:1px}
.nav-btn{width:100%;display:block;padding:12px;margin-bottom:5px;border:0;border-radius:7px;color:#dce8f3;background:transparent;text-align:left;font-size:14px}
.nav-btn:hover,.nav-btn.active{background:#ffffff20;color:white}
main{flex:1;min-width:0;padding:28px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.page-heading h1{margin:0;font-size:24px;color:var(--navy)}.page-heading p{color:var(--muted);margin:7px 0 0;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat-card{padding:20px;border:1px solid var(--border);border-radius:12px;background:white}
.stat-card .label{color:var(--muted);font-size:13px}.stat-card .number{font-size:28px;font-weight:bold;color:var(--navy);margin-top:12px}
.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;overflow:hidden}
.panel h3{margin:0 0 16px;color:var(--navy);font-size:16px}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);background:#f8fafc}.status{display:inline-block;padding:5px 9px;background:#e6f5ee;color:var(--green);border-radius:20px;font-size:11px}
.notice{padding:14px;border-radius:8px;background:#fff8e6;color:#8a641b;font-size:13px;line-height:1.5;margin-bottom:18px}
.muted{color:var(--muted);font-size:13px}.empty{padding:25px;text-align:center;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px}
.action-btn{border:1px solid var(--border);background:white;border-radius:7px;padding:7px 10px;margin:2px}
.action-btn:hover{background:#edf5fc;border-color:var(--blue)}
.receipt-line label{display:block;font-size:12px;font-weight:bold}
.receipt-line input,.receipt-line select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:7px}
.unit-info{margin-top:7px;padding:9px 10px;background:#edf5fc;border-radius:7px;color:var(--navy);font-size:12px;min-height:34px}
.quantity-preview{margin-top:7px;padding:9px 10px;background:#e8f6ef;color:#16845b;border-radius:7px;font-size:12px;font-weight:bold;min-height:34px}
.receipt-detail{font-size:12px;line-height:1.7;min-width:220px}
.receipt-detail-item{padding:5px 0;border-bottom:1px dashed var(--border)}.receipt-detail-item:last-child{border-bottom:0}
.edit-panel{border:2px solid var(--blue)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:195px}}
@media(max-width:650px){.topbar{padding:0 12px}.brand{font-size:14px}.user-area{gap:6px}.user-name{display:none}.layout{display:block}.sidebar{width:100%;display:flex;overflow-x:auto;padding:8px}.sidebar-title{display:none}.nav-btn{width:auto;white-space:nowrap;margin:0 3px;padding:10px}main{padding:17px}.cards{gap:10px}.stat-card{padding:14px}.stat-card .number{font-size:23px}.page-heading h1{font-size:20px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginPanel"><div class="login-card">
  <div class="login-logo">SF</div><h2>SIM Persediaan Farmasi</h2><p>Klinik RSAL Kodaeral XIV</p>
  <form id="loginForm">
    <label for="loginEmail">Email</label><input id="loginEmail" type="email" placeholder="Masukkan email" required>
    <label for="loginPassword">Password</label><input id="loginPassword" type="password" placeholder="Masukkan password" required>
    <button class="primary-btn" id="loginButton" type="submit">LOGIN</button>
  </form><div id="loginMessage" role="alert"></div>
</div></div>
<div id="app">
<header class="topbar"><div class="brand">SIM PERSEDIAAN FARMASI<small>KLINIK RSAL KODAERAL XIV</small></div>
<div class="user-area"><span class="user-name" id="userName"></span><span class="role" id="userRole"></span><button class="logout-btn" id="logoutButton">Logout</button></div></header>
<div class="layout"><aside class="sidebar">
  <div class="sidebar-title">Menu Utama</div>
  <button class="nav-btn active" data-page="dashboard">▦ Dashboard</button>
  <button class="nav-btn" data-page="items">▤ Master Barang</button>
  <button class="nav-btn" data-page="batches">▣ Stok per Batch</button>
  <div class="sidebar-title">Transaksi</div>
  <button class="nav-btn" data-page="receipts">↓ Penerimaan</button>
  <button class="nav-btn" data-page="issues">↑ Pengeluaran</button>
  <button class="nav-btn" data-page="recap">▤ Rekap Pengeluaran</button>
  <button class="nav-btn" data-page="cards">▧ Kartu Stok</button>
  <button class="nav-btn" data-page="stocktake">☑ Stok Opname</button>
  <div class="sidebar-title">Sistem</div><button class="nav-btn" data-page="settings">⚙ Pengaturan</button>
</aside><main><div id="pageContent"></div></main></div>
</div>
<script>
/* KONFIGURASI SUPABASE */
const SUPABASE_URL="https://janxyyhnbsrplcepyrgb.supabase.co";
const SUPABASE_KEY="sb_publishable_sb6G7bJjiUIseKwUeg3gtIA_11vdxJoO";
let supabaseClient=null,currentProfile=null,itemsData=[],batchesData=[],editingItemId=null,editingReceiptId=null;
const $=id=>document.getElementById(id);

function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function formatNumber(value){return Number(value||0).toLocaleString("id-ID");}
function formatQuantity(value,unit){return `${formatNumber(value)}${unit?" "+unit:""}`;}
function showLoginError(message){$("loginMessage").textContent=message;}
function initializeSupabase(){
  try{
    const raw=SUPABASE_URL.trim();
    if(!raw||raw.includes("MASUKKAN_")){showLoginError("Project URL belum diisi.");return false;}
    const parsed=new URL(raw);
    if(!["https:","http:"].includes(parsed.protocol)||parsed.username||parsed.password||parsed.search||parsed.hash|| (parsed.pathname!=="/"&&parsed.pathname!=="")){showLoginError("Project URL tidak valid.");return false;}
    if(!SUPABASE_KEY.trim()||SUPABASE_KEY.includes("MASUKKAN_")){showLoginError("Publishable Key belum diisi.");return false;}
    if(!window.supabase?.createClient){showLoginError("Library Supabase gagal dimuat. Periksa koneksi internet.");return false;}
    supabaseClient=window.supabase.createClient(raw.replace(/\/+$/,""),SUPABASE_KEY.trim());return true;
  }catch(e){showLoginError("Format Project URL tidak valid: "+e.message);return false;}
}

/* LOGIN DAN PROFIL */
$("loginForm").addEventListener("submit",async event=>{
  event.preventDefault();if(!supabaseClient)return;
  $("loginButton").disabled=true;$("loginButton").textContent="Memproses...";showLoginError("");
  try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});if(error)throw error;await loadUserProfile(data.user);}
  catch(e){showLoginError("Login gagal: "+e.message);}
  finally{$("loginButton").disabled=false;$("loginButton").textContent="LOGIN";}
});
async function loadUserProfile(user){
  const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",user.id).single();
  if(error||!profile){await supabaseClient.auth.signOut();showLoginError("Profil pengguna tidak ditemukan atau tidak dapat dibaca: "+(error?.message||""));return;}
  currentProfile=profile;$("userName").textContent=profile.full_name||user.email;$("userRole").textContent=(profile.role||"staff").toUpperCase();
  $("loginPanel").style.display="none";$("app").style.display="block";
  if(await loadDashboardData())showPage("dashboard");
}

/* MEMUAT DATA MASTER DAN BATCH */
async function loadDashboardData(){
  $("pageContent").innerHTML='<div class="empty">Mengambil data dari database...</div>';
  try{
    const [ir,br]=await Promise.all([supabaseClient.from("items").select("*"),supabaseClient.from("stock_batches").select("*")]);
    if(ir.error)throw ir.error;if(br.error)throw br.error;
    itemsData=ir.data||[];const map=Object.fromEntries(itemsData.map(x=>[x.id,x]));
    batchesData=(br.data||[]).map(b=>({...b,item:map[b.item_id]||null,expiry:b.expiry_date}));
    batchesData.sort((a,b)=>!a.expiry?1:!b.expiry?-1:new Date(a.expiry)-new Date(b.expiry));
  }catch(e){
    $("pageContent").innerHTML=`<div class="panel"><h3>Gagal membaca database</h3><p class="muted">${escapeHTML(e.message)}</p><button class="refresh-btn" onclick="refreshData()">Coba Lagi</button></div>`;return false;
  }return true;
}

/* DASHBOARD */
function renderDashboard(){
  const total=batchesData.reduce((s,b)=>s+Number(b.quantity??0),0);
  $("pageContent").innerHTML=`<div class="page-heading"><div><h1>Dashboard</h1><p>Ringkasan persediaan farmasi</p></div><button class="refresh-btn" onclick="refreshData()">↻ Refresh</button></div>
  <div class="notice">Data dibaca dari database Supabase. Modul pengeluaran dan stok opname masih dalam pengembangan.</div>
  <div class="cards">
    <div class="stat-card"><div class="label">Master Barang</div><div class="number">${formatNumber(itemsData.length)}</div></div>
    <div class="stat-card"><div class="label">Jumlah Batch</div><div class="number">${formatNumber(batchesData.length)}</div></div>
    <div class="stat-card"><div class="label">Total Kuantitas Batch</div><div class="number">${formatNumber(total)}</div></div>
    <div class="stat-card"><div class="label">Status Sistem</div><div class="number" style="font-size:20px;color:var(--green)">Terhubung</div></div>
  </div><div class="panel"><h3>Identitas Pengguna</h3><p>${escapeHTML(currentProfile?.full_name)}</p><p class="muted">Role: ${escapeHTML(currentProfile?.role)}</p></div>
  <div class="panel"><h3>Master Barang Terbaru</h3>${renderSimpleTable(itemsData.slice(0,10))}</div>`;
}
function renderSimpleTable(data){
  if(!data.length)return '<div class="empty">Belum ada data.</div>';
  const cols=Object.keys(data[0]).slice(0,7);
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${escapeHTML(c)}</th>`).join("")}</tr></thead><tbody>${data.map(r=>`<tr>${cols.map(c=>`<td>${escapeHTML(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* MASTER BARANG */
function renderItems(){
  const admin=currentProfile?.role==="admin";
  $("pageContent").innerHTML=`<div class="page-heading"><div><h1>Master Barang</h1><p>Pengelolaan data master persediaan farmasi</p></div><button class="refresh-btn" onclick="refreshData()">↻ Refresh</button></div>
  ${admin?`<div class="panel"><h3 id="itemFormTitle">Tambah Barang Baru</h3><form id="itemForm"><div class="form-grid">
  <div class="field"><label>Kode Barang</label><input id="itemCode" maxlength="50" required></div>
  <div class="field"><label>Nama Barang</label><input id="itemName" maxlength="200" required></div>
  <div class="field"><label>Kategori</label><input id="itemCategory" maxlength="100"></div>
  <div class="field"><label>Satuan</label><input id="itemUnit" maxlength="30" required></div>
  <div class="field"><label>Stok Minimum</label><input id="itemMinimum" type="number" min="0" step="0.01" value="0" required></div></div><br>
  <button class="primary-btn" id="saveItemButton">Simpan Barang</button><button type="button" class="refresh-btn" id="cancelItemEdit" style="display:none">Batal</button><p id="itemMessage" class="muted"></p></form></div>`:'<div class="notice">Akun Staff hanya dapat melihat data Master Barang.</div>'}
  <div class="panel"><h3>Daftar Barang (${itemsData.length})</h3><input id="itemSearch" type="search" placeholder="Cari kode atau nama barang..." style="width:100%;max-width:400px;padding:11px;margin-bottom:15px;border:1px solid var(--border);border-radius:7px"><div id="itemsTable"></div></div>`;
  renderItemsTableWithActions(itemsData);
  $("itemSearch").addEventListener("input",function(){const q=this.value.toLowerCase();renderItemsTableWithActions(itemsData.filter(i=>[i.item_code,i.item_name,i.category].some(v=>String(v||"").toLowerCase().includes(q))));});
  if(admin){$("itemForm").addEventListener("submit",saveItem);$("cancelItemEdit").addEventListener("click",resetItemForm);}
}
function renderItemsTableWithActions(data){
  const c=$("itemsTable"),admin=currentProfile?.role==="admin";if(!data.length){c.innerHTML='<div class="empty">Belum ada data barang yang sesuai.</div>';return;}
  c.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama Barang</th><th>Kategori</th><th>Satuan</th><th>Stok Minimum</th><th>Status</th>${admin?"<th>Aksi</th>":""}</tr></thead><tbody>
  ${data.map(i=>`<tr><td>${escapeHTML(i.item_code)}</td><td>${escapeHTML(i.item_name)}</td><td>${escapeHTML(i.category||"-")}</td><td>${escapeHTML(i.unit)}</td><td>${formatNumber(i.minimum_stock)}</td><td>${i.is_active?'<span class="status">Aktif</span>':'<span class="status" style="background:#fce8e8;color:#a22">Nonaktif</span>'}</td>
  ${admin?`<td><button class="action-btn" data-edit="${escapeHTML(i.id)}">Ubah</button><button class="action-btn" data-toggle="${escapeHTML(i.id)}">${i.is_active?"Nonaktifkan":"Aktifkan"}</button></td>`:""}</tr>`).join("")}</tbody></table></div>`;
  c.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>editItem(b.dataset.edit)));
  c.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>toggleItem(b.dataset.toggle)));
}
async function saveItem(e){
  e.preventDefault();if(currentProfile?.role!=="admin")return;
  const msg=$("itemMessage"),btn=$("saveItemButton");
  const item={item_code:$("itemCode").value.trim(),item_name:$("itemName").value.trim(),category:$("itemCategory").value.trim()||null,unit:$("itemUnit").value.trim(),minimum_stock:Number($("itemMinimum").value)};
  if(!item.item_code||!item.item_name||!item.unit){msg.textContent="Kode, nama, dan satuan wajib diisi.";return;}
  if(!Number.isFinite(item.minimum_stock)||item.minimum_stock<0){msg.textContent="Stok minimum harus angka nol atau lebih.";return;}
  btn.disabled=true;btn.textContent="Menyimpan...";
  try{const r=editingItemId?await supabaseClient.from("items").update(item).eq("id",editingItemId):await supabaseClient.from("items").insert(item);if(r.error)throw r.error;alert(editingItemId?"Perubahan berhasil disimpan.":"Barang berhasil ditambahkan.");editingItemId=null;await loadDashboardData();showPage("items");}
  catch(err){msg.textContent="Gagal menyimpan: "+err.message;btn.disabled=false;btn.textContent=editingItemId?"Simpan Perubahan":"Simpan Barang";}
}
function editItem(id){const i=itemsData.find(x=>x.id===id);if(!i)return;editingItemId=id;$("itemCode").value=i.item_code||"";$("itemName").value=i.item_name||"";$("itemCategory").value=i.category||"";$("itemUnit").value=i.unit||"";$("itemMinimum").value=i.minimum_stock??0;$("itemFormTitle").textContent="Ubah Data Barang";$("saveItemButton").textContent="Simpan Perubahan";$("cancelItemEdit").style.display="inline-block";$("itemForm").scrollIntoView({behavior:"smooth"});}
function resetItemForm(){editingItemId=null;$("itemForm").reset();$("itemMinimum").value=0;$("itemFormTitle").textContent="Tambah Barang Baru";$("saveItemButton").textContent="Simpan Barang";$("cancelItemEdit").style.display="none";$("itemMessage").textContent="";}
async function toggleItem(id){
  if(currentProfile?.role!=="admin")return;const i=itemsData.find(x=>x.id===id);if(!i)return;
  const next=!i.is_active;if(!confirm(`Yakin ingin ${next?"mengaktifkan":"menonaktifkan"} ${i.item_name}?`))return;
  const {error}=await supabaseClient.from("items").update({is_active:next}).eq("id",id);if(error){alert("Gagal mengubah status: "+error.message);return;}await loadDashboardData();showPage("items");
}

/* STOK PER BATCH */
function getBatchStatus(b){
  const qty=Number(b.quantity||0);
  if(b.expiry){const today=new Date();today.setHours(0,0,0,0);const d=new Date(b.expiry+"T00:00:00");if(!Number.isNaN(d.getTime())){const diff=Math.ceil((d-today)/86400000);if(diff<0)return{key:"expired",label:"Kedaluwarsa"};if(diff<=90)return{key:"near",label:"Segera Kedaluwarsa"};}}
  if(qty<=0)return{key:"empty",label:"Stok Kosong"};return{key:"available",label:"Tersedia"};
}
function formatExpiry(v){if(!v)return"-";const d=new Date(v+"T00:00:00");return Number.isNaN(d.getTime())?"-":d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});}
function renderBatches(){
  const total=batchesData.reduce((s,b)=>s+Number(b.quantity||0),0),counts={expired:0,near:0,empty:0,available:0};batchesData.forEach(b=>counts[getBatchStatus(b).key]++);
  $("pageContent").innerHTML=`<div class="page-heading"><div><h1>Stok per Batch</h1><p>Monitoring persediaan berdasarkan nomor batch dan ED</p></div><button class="refresh-btn" onclick="refreshData()">↻ Refresh</button></div>
  <div class="cards"><div class="stat-card"><div class="label">Jumlah Batch</div><div class="number">${formatNumber(batchesData.length)}</div></div><div class="stat-card"><div class="label">Total Kuantitas</div><div class="number">${formatNumber(total)}</div></div><div class="stat-card"><div class="label">Segera Kedaluwarsa</div><div class="number" style="color:#b7791f">${formatNumber(counts.near)}</div></div><div class="stat-card"><div class="label">Kedaluwarsa</div><div class="number" style="color:var(--red)">${formatNumber(counts.expired)}</div></div></div>
  <div class="panel"><h3>Daftar Stok per Batch</h3><div class="form-grid" style="margin-bottom:18px"><div class="field"><label>Pencarian</label><input id="batchSearch" type="search" placeholder="Nama barang, kode, atau nomor batch"></div><div class="field"><label>Filter Status</label><select id="batchStatusFilter"><option value="all">Semua Status</option><option value="available">Tersedia</option><option value="empty">Stok Kosong</option><option value="near">Segera Kedaluwarsa</option><option value="expired">Kedaluwarsa</option></select></div></div><div id="batchTable"></div></div>`;
  function display(){
    const q=$("batchSearch").value.toLowerCase(),f=$("batchStatusFilter").value;
    const rows=batchesData.filter(b=>[b.item?.item_code,b.item?.item_name,b.batch_number].join(" ").toLowerCase().includes(q)&&(f==="all"||getBatchStatus(b).key===f));
    if(!rows.length){$("batchTable").innerHTML='<div class="empty">Tidak ada data batch yang sesuai.</div>';return;}
    $("batchTable").innerHTML=`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Kode Barang</th><th>Nama Barang</th><th>Nomor Batch</th><th>ED</th><th>Jumlah Stok</th><th>Satuan</th><th>Status</th></tr></thead><tbody>
    ${rows.map((b,n)=>{const s=getBatchStatus(b),style=s.key==="expired"?"background:#fce8e8;color:#a22":s.key==="near"?"background:#fff3cd;color:#856404":s.key==="empty"?"background:#edf0f4;color:#596579":"";return `<tr><td>${n+1}</td><td>${escapeHTML(b.item?.item_code||"-")}</td><td>${escapeHTML(b.item?.item_name||"Barang tidak ditemukan")}</td><td>${escapeHTML(b.batch_number||"-")}</td><td>${formatExpiry(b.expiry)}</td><td><strong>${escapeHTML(formatQuantity(b.quantity,b.item?.unit))}</strong></td><td>${escapeHTML(b.item?.unit||"-")}</td><td><span class="status" style="${style}">${s.label}</span></td></tr>`;}).join("")}</tbody></table></div><p class="muted" style="margin-top:12px">Menampilkan ${rows.length} dari ${batchesData.length} batch. Batas peringatan kedaluwarsa: 90 hari.</p>`;
  }
  $("batchSearch").addEventListener("input",display);$("batchStatusFilter").addEventListener("change",display);display();
}

/* FORM PENERIMAAN */
function receiptItemOptions(){return itemsData.filter(i=>i.is_active!==false).map(i=>`<option value="${escapeHTML(i.id)}">${escapeHTML(i.item_code)} - ${escapeHTML(i.item_name)}</option>`).join("");}
function addReceiptLine(){
  const row=document.createElement("div");row.className="receipt-line panel";row.style.marginBottom="12px";
  row.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
  <label>Nama Barang<select class="r-item" required><option value="">Pilih barang</option>${receiptItemOptions()}</select><div class="unit-info r-unit-info">Pilih barang untuk melihat satuan.</div></label>
  <label>Nomor Batch<input class="r-batch" required placeholder="Nomor batch"></label><label>Tanggal Kedaluwarsa<input class="r-expiry" type="date" required></label>
  <label class="r-quantity-label">Jumlah<input class="r-quantity" type="number" min="0.01" step="any" required placeholder="Masukkan jumlah"><div class="quantity-preview r-quantity-preview">Preview jumlah akan tampil di sini.</div></label>
  <label>Harga Satuan (Rp)<input class="r-price" type="number" min="0" step="any" required placeholder="Harga per satuan"></label></div><button type="button" class="refresh-btn r-remove" style="margin-top:10px">Hapus Barang</button>`;
  $("receiptLines").appendChild(row);
  const sel=row.querySelector(".r-item"),qty=row.querySelector(".r-quantity"),preview=row.querySelector(".r-quantity-preview"),unitInfo=row.querySelector(".r-unit-info"),label=row.querySelector(".r-quantity-label");
  function update(){const i=itemsData.find(x=>x.id===sel.value),unit=i?.unit?.trim()||"";unitInfo.textContent="Satuan: "+(unit||"Belum diisi");label.firstChild.textContent="Jumlah ("+unit+")";const n=Number(qty.value);preview.textContent=!i||qty.value===""?"Preview jumlah akan tampil di sini.":Number.isFinite(n)&&n>0?"Jumlah diterima: "+formatQuantity(n,unit):"Masukkan jumlah yang valid.";}
  sel.addEventListener("change",update);qty.addEventListener("input",update);row.querySelector(".r-remove").addEventListener("click",()=>row.remove());
}
function addEditReceiptLine(line={}){
  const row=document.createElement("div");row.className="receipt-line panel";row.style.marginBottom="12px";
  row.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
  <label>Nama Barang<select class="er-item" required><option value="">Pilih barang</option>${receiptItemOptions()}</select><div class="unit-info er-unit">Satuan barang</div></label>
  <label>Nomor Batch<input class="er-batch" required></label><label>Tanggal Kedaluwarsa<input class="er-expiry" type="date" required></label>
  <label>Jumlah<input class="er-quantity" type="number" min="0.01" step="any" required></label><label>Harga Satuan (Rp)<input class="er-price" type="number" min="0" step="any" required></label></div>
  <button type="button" class="refresh-btn er-remove" style="margin-top:10px">Hapus Barang</button>`;
  $("editReceiptLines").appendChild(row);const sel=row.querySelector(".er-item");sel.value=line.item_id||"";row.querySelector(".er-batch").value=line.batch_number||"";row.querySelector(".er-expiry").value=line.expiry_date||"";row.querySelector(".er-quantity").value=line.quantity??"";row.querySelector(".er-price").value=line.unit_price??0;
  function update(){row.querySelector(".er-unit").textContent="Satuan: "+(itemsData.find(x=>x.id===sel.value)?.unit||"-");}sel.addEventListener("change",update);update();
  row.querySelector(".er-remove").addEventListener("click",()=>{if($("editReceiptLines").querySelectorAll(".receipt-line").length<=1){alert("Minimal harus ada satu barang.");return;}row.remove();});
}

/* EDIT PENERIMAAN */
async function openReceiptEdit(id){
  if(currentProfile?.role!=="admin")return;const panel=$("receiptEditPanel");if(!panel)return;panel.innerHTML='<div class="empty">Mengambil data penerimaan...</div>';
  try{
    const {data:r,error}=await supabaseClient.from("goods_receipts").select("*").eq("id",id).single();if(error)throw error;
    const {data:lines,error:le}=await supabaseClient.from("goods_receipt_lines").select("*").eq("receipt_id",id);if(le)throw le;if(!lines?.length)throw new Error("Detail barang tidak ditemukan.");
    editingReceiptId=id;
    panel.innerHTML=`<div class="panel edit-panel"><h3>Edit Penerimaan</h3><div class="notice">Perubahan akan dikoreksi pada stok dan dicatat sebagai pergerakan stok baru. Riwayat pergerakan sebelumnya tidak dihapus.</div>
    <form id="editReceiptForm"><div class="form-grid"><div class="field"><label>Nomor Penerimaan</label><input id="erNumber" required></div><div class="field"><label>Tanggal Penerimaan</label><input id="erDate" type="date" required></div><div class="field"><label>Nama Supplier</label><input id="erSupplier" required></div><div class="field"><label>Catatan</label><input id="erNotes"></div></div><hr style="margin:20px 0"><h3>Detail Barang</h3><div id="editReceiptLines"></div>
    <button type="button" class="refresh-btn" id="addEditLine">+ Tambah Barang</button><hr style="margin:20px 0"><button type="submit" class="primary-btn" id="saveEditReceipt">Simpan Perubahan</button> <button type="button" class="refresh-btn" id="cancelEditReceipt">Batal</button><p id="editReceiptMessage" class="muted"></p></form></div>`;
    $("erNumber").value=r.receipt_number||"";$("erDate").value=r.receipt_date||"";$("erSupplier").value=r.supplier||"";$("erNotes").value=r.notes||"";
    lines.forEach(l=>addEditReceiptLine(l));$("addEditLine").addEventListener("click",()=>addEditReceiptLine());
    $("cancelEditReceipt").addEventListener("click",()=>{editingReceiptId=null;panel.innerHTML="";});
    $("editReceiptForm").addEventListener("submit",saveReceiptEdit);panel.scrollIntoView({behavior:"smooth"});
  }catch(e){editingReceiptId=null;panel.innerHTML=`<div class="notice">Gagal membuka data penerimaan: ${escapeHTML(e.message)}</div>`;}
}
async function saveReceiptEdit(e){
  e.preventDefault();if(!editingReceiptId||currentProfile?.role!=="admin")return;
  const btn=$("saveEditReceipt"),msg=$("editReceiptMessage"),rows=[...document.querySelectorAll("#editReceiptLines .receipt-line")];
  const lines=rows.map(row=>({item_id:row.querySelector(".er-item").value,batch_number:row.querySelector(".er-batch").value.trim(),expiry_date:row.querySelector(".er-expiry").value,quantity:Number(row.querySelector(".er-quantity").value),unit_price:Number(row.querySelector(".er-price").value)}));
  if(!lines.length||lines.some(l=>!l.item_id||!l.batch_number||!l.expiry_date||!Number.isFinite(l.quantity)||l.quantity<=0||!Number.isFinite(l.unit_price)||l.unit_price<0)){msg.textContent="Periksa kembali seluruh detail barang.";return;}
  const params={p_receipt_id:editingReceiptId,p_receipt_number:$("erNumber").value.trim(),p_receipt_date:$("erDate").value,p_supplier:$("erSupplier").value.trim(),p_notes:$("erNotes").value.trim(),p_lines:lines};
  if(!params.p_receipt_number||!params.p_receipt_date||!params.p_supplier){msg.textContent="Nomor, tanggal, dan supplier wajib diisi.";return;}
  if(!confirm("Simpan perubahan penerimaan? Stok dan Kartu Stok akan dikoreksi."))return;
  btn.disabled=true;btn.textContent="Menyimpan...";msg.textContent="";
  try{const {error}=await supabaseClient.rpc("edit_goods_receipt",params);if(error)throw error;alert("Perubahan penerimaan berhasil disimpan.");editingReceiptId=null;await loadDashboardData();showPage("receipts");}
  catch(err){msg.textContent="Gagal mengedit penerimaan: "+err.message;btn.disabled=false;btn.textContent="Simpan Perubahan";}
}

/* RIWAYAT PENERIMAAN */
async function loadReceiptHistory(){
  const target=$("receiptHistory");if(!target)return;target.innerHTML='<div class="empty">Memuat riwayat penerimaan...</div>';
  const {data,error}=await supabaseClient.from("goods_receipts").select("id,receipt_number,receipt_date,supplier,notes,created_at").order("receipt_date",{ascending:false});
  if(error){target.innerHTML=`<div class="notice">Gagal membaca riwayat: ${escapeHTML(error.message)}</div>`;return;}
  if(!data?.length){target.innerHTML='<div class="empty">Belum ada transaksi penerimaan.</div>';return;}
  const ids=data.map(x=>x.id),{data:lines,error:le}=await supabaseClient.from("goods_receipt_lines").select("id,receipt_id,item_id,batch_number,expiry_date,quantity,unit_price,unit").in("receipt_id",ids);
  const itemMap=Object.fromEntries(itemsData.map(i=>[i.id,i])),by={};if(!le&&lines)lines.forEach(l=>(by[l.receipt_id]??=[]).push(l));
  target.innerHTML=`${le?`<div class="notice">Detail barang belum dapat ditampilkan: ${escapeHTML(le.message)}</div>`:""}<div class="table-wrap"><table><thead><tr><th>No. Penerimaan</th><th>Tanggal</th><th>Pemasok</th><th>Detail Barang</th><th>Catatan</th>${currentProfile?.role==="admin"?"<th>Aksi</th>":""}</tr></thead><tbody>
  ${data.map(r=>{const detail=(by[r.id]||[]).map(l=>`<div class="receipt-detail-item"><strong>${escapeHTML(itemMap[l.item_id]?.item_name||"Barang tidak ditemukan")}</strong><br>Jumlah: ${escapeHTML(formatQuantity(l.quantity,l.unit||itemMap[l.item_id]?.unit||""))}<br>Batch: ${escapeHTML(l.batch_number||"-")}<br>ED: ${escapeHTML(formatExpiry(l.expiry_date))}</div>`).join("")||'<span class="muted">Detail tidak tersedia</span>';
  return `<tr><td><strong>${escapeHTML(r.receipt_number)}</strong></td><td>${formatExpiry(r.receipt_date)}</td><td>${escapeHTML(r.supplier||"-")}</td><td><div class="receipt-detail">${detail}</div></td><td>${escapeHTML(r.notes||"-")}</td>${currentProfile?.role==="admin"?`<td><button class="action-btn" data-edit-receipt="${escapeHTML(r.id)}">Edit</button></td>`:""}</tr>`;}).join("")}</tbody></table></div>`;
  target.querySelectorAll("[data-edit-receipt]").forEach(b=>b.addEventListener("click",()=>openReceiptEdit(b.dataset.editReceipt)));
}
async function renderReceipts(){
  const admin=currentProfile?.role==="admin";editingReceiptId=null;
  $("pageContent").innerHTML=`<div class="page-heading"><div><h1>Penerimaan Barang</h1><p>Pencatatan barang masuk dari pemasok.</p></div><button class="refresh-btn" onclick="refreshData()">↻ Refresh</button></div>
  ${admin?`<div class="panel"><h3>Informasi Penerimaan</h3><form id="receiptForm"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
  <label>Nomor Faktur / Penerimaan<input id="receiptNumber" required style="display:block;width:100%;padding:11px;border:1px solid var(--border);border-radius:7px"></label>
  <label>Tanggal Penerimaan<input id="receiptDate" type="date" required style="display:block;width:100%;padding:11px;border:1px solid var(--border);border-radius:7px"></label>
  <label>Nama Pemasok<input id="receiptSupplier" required style="display:block;width:100%;padding:11px;border:1px solid var(--border);border-radius:7px"></label>
  <label>Catatan<input id="receiptNotes" style="display:block;width:100%;padding:11px;border:1px solid var(--border);border-radius:7px"></label></div><hr style="margin:20px 0"><h3>Detail Barang</h3><div class="notice">Pilih barang terlebih dahulu. Satuan mengikuti satuan pada Master Barang.</div><div id="receiptLines"></div>
  <button type="button" class="refresh-btn" id="addReceiptLine">+ Tambah Barang</button><hr style="margin:20px 0"><button type="submit" class="primary-btn" id="saveReceipt">Simpan Penerimaan</button><div id="receiptMessage" style="margin-top:12px"></div></form></div>`:'<div class="notice">Akun Staff hanya dapat melihat riwayat penerimaan. Penyimpanan transaksi hanya dapat dilakukan oleh Admin.</div>'}
  <div id="receiptEditPanel"></div><div class="panel"><h3>Riwayat Penerimaan</h3><div id="receiptHistory"><div class="empty">Memuat data...</div></div></div>`;
  if(admin){
    $("receiptDate").value=new Date().toLocaleDateString("en-CA");addReceiptLine();$("addReceiptLine").addEventListener("click",addReceiptLine);
    $("receiptForm").addEventListener("submit",async e=>{
      e.preventDefault();const btn=$("saveReceipt"),msg=$("receiptMessage"),rows=[...document.querySelectorAll("#receiptLines .receipt-line")];
      const lines=rows.map(r=>({item_id:r.querySelector(".r-item").value,batch_number:r.querySelector(".r-batch").value.trim(),expiry_date:r.querySelector(".r-expiry").value,quantity:r.querySelector(".r-quantity").value,unit_price:r.querySelector(".r-price").value}));
      if(!lines.length||lines.some(l=>!l.item_id||!l.batch_number||!l.expiry_date||!Number.isFinite(Number(l.quantity))||Number(l.quantity)<=0||l.unit_price===""||!Number.isFinite(Number(l.unit_price))||Number(l.unit_price)<0)){msg.textContent="Periksa kembali seluruh data barang.";return;}
      if(!$("receiptNumber").value.trim()||!$("receiptSupplier").value.trim()||!$("receiptDate").value){msg.textContent="Nomor, tanggal, dan pemasok wajib diisi.";return;}
      if(!confirm("Apakah data penerimaan sudah benar dan akan disimpan?"))return;
      btn.disabled=true;btn.textContent="Menyimpan...";msg.textContent="";
      try{const {error}=await supabaseClient.rpc("create_goods_receipt",{p_receipt_number:$("receiptNumber").value.trim(),p_receipt_date:$("receiptDate").value,p_supplier:$("receiptSupplier").value.trim(),p_notes:$("receiptNotes").value.trim(),p_lines:lines});if(error)throw error;
        msg.textContent="Penerimaan berhasil disimpan.";$("receiptForm").reset();$("receiptDate").value=new Date().toLocaleDateString("en-CA");$("receiptLines").innerHTML="";addReceiptLine();await loadDashboardData();await loadReceiptHistory();
      }catch(err){msg.textContent="Gagal menyimpan penerimaan: "+err.message;}finally{btn.disabled=false;btn.textContent="Simpan Penerimaan";}
    });
  }await loadReceiptHistory();
}

/* KARTU STOK - MEMBACA VIEW SUPABASE */
async function renderStockCards(){
  $("pageContent").innerHTML=`<div class="page-heading"><div><h1>Kartu Stok</h1><p>Riwayat mutasi dan saldo berjalan persediaan farmasi.</p></div><button class="refresh-btn" id="refreshStockCard">↻ Refresh</button></div>
  <div class="panel"><h3>Filter Kartu Stok</h3><div class="form-grid">
  <div class="field"><label>Nama Barang</label><select id="stockCardItem"><option value="">Semua Barang</option>${itemsData.map(i=>`<option value="${escapeHTML(i.id)}">${escapeHTML(i.item_code)} - ${escapeHTML(i.item_name)}</option>`).join("")}</select></div>
  <div class="field"><label>Nomor Batch</label><select id="stockCardBatch"><option value="">Semua Batch</option></select></div>
  </div></div><div class="panel"><h3>Riwayat Mutasi Stok</h3><div id="stockCardTable"><div class="empty">Mengambil data Kartu Stok...</div></div></div>`;
  $("refreshStockCard").addEventListener("click",renderStockCards);
  $("stockCardItem").addEventListener("change",()=>{updateBatchOptions();displayStockCard();});
  $("stockCardBatch").addEventListener("change",displayStockCard);
  let stockCardData=[];
  try{
    const {data,error}=await supabaseClient.from("v_stock_card_running").select("*").order("created_at",{ascending:false}).limit(2000);
    if(error)throw error;stockCardData=data||[];
    updateBatchOptions();displayStockCard();
  }catch(e){$("stockCardTable").innerHTML=`<div class="notice">Gagal membaca Kartu Stok: ${escapeHTML(e.message)}</div>`;}

  function updateBatchOptions(){
    const itemId=$("stockCardItem").value,selected=$("stockCardBatch").value;
    const rows=stockCardData.filter(r=>!itemId||r.item_id===itemId),map=new Map();
    rows.forEach(r=>{if(r.batch_id)map.set(r.batch_id,r.batch_number||"-");});
    $("stockCardBatch").innerHTML=`<option value="">Semua Batch</option>${[...map.entries()].map(([id,num])=>`<option value="${escapeHTML(id)}">${escapeHTML(num)}</option>`).join("")}`;
    if(map.has(selected))$("stockCardBatch").value=selected;
  }
  function displayStockCard(){
    const itemId=$("stockCardItem").value,batchId=$("stockCardBatch").value;
    const rows=stockCardData.filter(r=>(!itemId||r.item_id===itemId)&&(!batchId||r.batch_id===batchId));
    if(!rows.length){$("stockCardTable").innerHTML='<div class="empty">Belum ada transaksi untuk pilihan tersebut.</div>';return;}
    $("stockCardTable").innerHTML=`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Waktu Transaksi</th><th>Kode Barang</th><th>Nama Barang</th><th>Nomor Batch</th><th>ED</th><th>Jenis</th><th>Masuk</th><th>Keluar</th><th>Saldo Berjalan</th><th>No. Referensi</th><th>Petugas (ID)</th></tr></thead><tbody>
    ${rows.map((r,n)=>{const type=String(r.movement_type||"").toUpperCase(),inflow=type==="IN";return `<tr><td>${n+1}</td><td>${r.created_at?escapeHTML(new Date(r.created_at).toLocaleString("id-ID")):"-"}</td><td>${escapeHTML(r.item_code||"-")}</td><td><strong>${escapeHTML(r.item_name||"-")}</strong></td><td>${escapeHTML(r.batch_number||"-")}</td><td>${formatExpiry(r.expiry_date)}</td><td><span class="status" style="${inflow?"background:#e6f5ee;color:#16845b":"background:#fce8e8;color:#c43d3d"}">${escapeHTML(type||"-")}</span></td><td style="color:var(--green);font-weight:bold">${formatNumber(r.quantity_in)}</td><td style="color:var(--red);font-weight:bold">${formatNumber(r.quantity_out)}</td><td><strong>${formatNumber(r.running_balance)}</strong></td><td>${escapeHTML(r.receipt_number||r.reference_id||"-")}</td><td>${escapeHTML(r.created_by||"-")}</td></tr>`;}).join("")}</tbody></table></div><p class="muted" style="margin-top:12px">Menampilkan ${rows.length} transaksi. Saldo dihitung per barang dan per batch.</p>`;
  }
}

/* MODUL LAIN YANG BELUM DIAKTIFKAN */
const futurePages={
  issues:["Pengeluaran Barang","Pencatatan barang keluar dan distribusi."],
  recap:["Rekap Pengeluaran","Laporan pengeluaran berdasarkan periode."],
  stocktake:["Stok Opname","Pencocokan stok fisik dengan sistem."],
  settings:["Pengaturan","Pengaturan pengguna dan sistem."]
};
function renderFuturePage(page){
  const c=futurePages[page];if(!c)return;
  $("pageContent").innerHTML=`<div class="page-heading"><div><h1>${c[0]}</h1><p>${c[1]}</p></div></div><div class="notice">Modul ini masih dalam tahap pengembangan.</div><div class="panel"><h3>${c[0]}</h3><div class="empty">Fitur akan diaktifkan setelah alur transaksi dan keamanan selesai disiapkan.</div></div>`;
}

/* NAVIGASI */
function showPage(page){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="dashboard")renderDashboard();
  else if(page==="items")renderItems();
  else if(page==="batches")renderBatches();
  else if(page==="receipts")renderReceipts();
  else if(page==="cards")renderStockCards();
  else if(futurePages[page])renderFuturePage(page);
}
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
async function refreshData(){const page=document.querySelector(".nav-btn.active")?.dataset.page||"dashboard";if(await loadDashboardData())showPage(page);}
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.reload();});
async function checkSession(){
  if(!initializeSupabase())return;
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){showLoginError(error.message);return;}
  if(data.session)await loadUserProfile(data.session.user);
}
checkSession();
</script>
