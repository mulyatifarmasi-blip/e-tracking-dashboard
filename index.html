
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM Persediaan Farmasi - RSAL Kodaeral XIV</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#123b65;
  --blue:#1769aa;
  --bg:#f3f6fa;
  --white:#fff;
  --text:#243247;
  --muted:#718096;
  --border:#e3e9f0;
  --green:#16845b;
  --red:#c43d3d;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}

/* LOGIN */
#loginPanel{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:20px;background:#edf2f7
}
.login-card{
  width:100%;max-width:400px;padding:32px;
  background:white;border-radius:16px;
  box-shadow:0 10px 35px #102b461c
}
.login-logo{
  width:55px;height:55px;display:grid;place-items:center;
  background:var(--navy);color:white;border-radius:12px;
  font-size:25px;font-weight:bold;margin-bottom:20px
}
.login-card h2{margin:0 0 8px;color:var(--navy)}
.login-card p{color:var(--muted);font-size:14px}
.login-card label{display:block;margin:16px 0 7px;font-size:13px;font-weight:bold}
.login-card input{
  width:100%;padding:13px;border:1px solid var(--border);
  border-radius:8px;outline-color:var(--blue)
}
.primary-btn{
  padding:12px 18px;background:var(--navy);color:white;
  border:0;border-radius:8px;font-weight:bold
}
.login-card .primary-btn{width:100%;margin-top:20px}
.primary-btn:disabled{opacity:.6;cursor:wait}
#loginMessage{color:var(--red);font-size:13px;line-height:1.5}

/* APP */
#app{display:none;min-height:100vh}
.topbar{
  height:66px;background:white;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:20
}
.brand{font-weight:bold;color:var(--navy);font-size:17px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:normal;margin-top:4px}
.user-area{display:flex;align-items:center;gap:12px;font-size:13px}
.role{background:#e7f0fa;color:var(--navy);padding:6px 10px;border-radius:20px;font-weight:bold}
.logout-btn,.refresh-btn{
  border:1px solid var(--border);background:white;
  padding:8px 12px;border-radius:7px
}
.layout{display:flex;min-height:calc(100vh - 66px)}
.sidebar{
  width:235px;flex-shrink:0;background:var(--navy);
  padding:22px 12px;color:white
}
.sidebar-title{
  color:#a9c5df;font-size:11px;padding:10px 12px;
  text-transform:uppercase;letter-spacing:1px
}
.nav-btn{
  width:100%;display:block;padding:12px;margin-bottom:5px;
  border:0;border-radius:7px;color:#dce8f3;
  background:transparent;text-align:left;font-size:14px
}
.nav-btn:hover,.nav-btn.active{background:#ffffff20;color:white}
main{flex:1;min-width:0;padding:28px}
.page-heading{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:24px
}
.page-heading h1{margin:0;font-size:24px;color:var(--navy)}
.page-heading p{color:var(--muted);margin:7px 0 0;font-size:13px}
.cards{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;margin-bottom:22px
}
.stat-card{
  padding:20px;border:1px solid var(--border);
  border-radius:12px;background:white
}
.stat-card .label{color:var(--muted);font-size:13px}
.stat-card .number{font-size:28px;font-weight:bold;color:var(--navy);margin-top:12px}
.panel{
  background:white;border:1px solid var(--border);
  border-radius:12px;padding:20px;margin-bottom:20px;overflow:hidden
}
.panel h3{margin:0 0 16px;color:var(--navy);font-size:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);background:#f8fafc}
.status{
  display:inline-block;padding:5px 9px;background:#e6f5ee;
  color:var(--green);border-radius:20px;font-size:11px
}
.notice{
  padding:14px;border-radius:8px;background:#fff8e6;
  color:#8a641b;font-size:13px;line-height:1.5;margin-bottom:18px
}
.muted{color:var(--muted);font-size:13px}
.empty{padding:25px;text-align:center;color:var(--muted)}
.form-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px
}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input{
  width:100%;padding:11px;border:1px solid var(--border);border-radius:7px
}
.action-btn{
  border:1px solid var(--border);background:white;
  border-radius:7px;padding:7px 10px;margin:2px
}
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sidebar{width:195px}
}
@media(max-width:650px){
  .topbar{padding:0 12px}
  .brand{font-size:14px}
  .user-area{gap:6px}
  .user-name{display:none}
  .layout{display:block}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:8px}
  .sidebar-title{display:none}
  .nav-btn{width:auto;white-space:nowrap;margin:0 3px;padding:10px}
  main{padding:17px}
  .cards{gap:10px}
  .stat-card{padding:14px}
  .stat-card .number{font-size:23px}
  .page-heading h1{font-size:20px}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPanel">
  <div class="login-card">
    <div class="login-logo">SF</div>
    <h2>SIM Persediaan Farmasi</h2>
    <p>Klinik RSAL Kodaeral XIV</p>

    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="Masukkan email" required>

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="Masukkan password" required>

      <button class="primary-btn" id="loginButton" type="submit">LOGIN</button>
    </form>
    <div id="loginMessage" role="alert"></div>
  </div>
</div>

<!-- APLIKASI -->
<div id="app">
  <header class="topbar">
    <div class="brand">
      SIM PERSEDIAAN FARMASI
      <small>KLINIK RSAL KODAERAL XIV</small>
    </div>
    <div class="user-area">
      <span class="user-name" id="userName"></span>
      <span class="role" id="userRole"></span>
      <button class="logout-btn" id="logoutButton">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Menu Utama</div>
      <button class="nav-btn active" data-page="dashboard">▦ Dashboard</button>
      <button class="nav-btn" data-page="items">▤ Master Barang</button>
      <button class="nav-btn" data-page="batches">▣ Stok per Batch</button>

      <div class="sidebar-title">Transaksi</div>
      <button class="nav-btn" data-page="receipts">↓ Penerimaan</button>
      <button class="nav-btn" data-page="issues">↑ Pengeluaran</button>
      <button class="nav-btn" data-page="recap">▤ Rekap Pengeluaran</button>
      <button class="nav-btn" data-page="cards">▧ Kartu Stok</button>
      <button class="nav-btn" data-page="stocktake">☑ Stok Opname</button>

      <div class="sidebar-title">Sistem</div>
      <button class="nav-btn" data-page="settings">⚙ Pengaturan</button>
    </aside>

    <main>
      <div id="pageContent"></div>
    </main>
  </div>
</div>

<script>
/* =========================================
   KONFIGURASI
   Masukkan URL dan Publishable Key Supabase
========================================= */

const SUPABASE_URL = "https://janxyyhnbsrplcepyrgb.supabase.co";
const SUPABASE_KEY = "sb_publishable_sb6G7BjiUIseKwUeg3gtIA_11vdxJoO";

let supabaseClient = null;
let currentProfile = null;
let itemsData = [];
let batchesData = [];
let editingItemId = null;

const $ = id => document.getElementById(id);

/* =========================================
   UTILITAS
========================================= */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  })[c]);
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString("id-ID");
}

function showLoginError(message) {
  $("loginMessage").textContent = message;
}

function initializeSupabase() {
  try {
    const raw = SUPABASE_URL.trim();

    if (!raw || raw.includes("MASUKKAN_")) {
      showLoginError("Project URL belum diisi.");
      return false;
    }

    const parsed = new URL(raw);

    if (!["https:", "http:"].includes(parsed.protocol)) {
      showLoginError("Project URL harus menggunakan https://.");
      return false;
    }

    if (parsed.username || parsed.password ||
        parsed.search || parsed.hash) {
      showLoginError("Project URL mengandung bagian yang tidak diperlukan.");
      return false;
    }

    if (parsed.pathname !== "/" && parsed.pathname !== "") {
      showLoginError(
        "Project URL tidak boleh memiliki path tambahan seperti /dashboard, /auth/v1, atau /rest/v1."
      );
      return false;
    }

    if (!SUPABASE_KEY.trim() ||
        SUPABASE_KEY.includes("MASUKKAN_")) {
      showLoginError("Publishable Key belum diisi.");
      return false;
    }

    if (!window.supabase || !window.supabase.createClient) {
      showLoginError("Library Supabase gagal dimuat. Periksa koneksi internet.");
      return false;
    }

    supabaseClient = window.supabase.createClient(
      raw.replace(/\/+$/, ""),
      SUPABASE_KEY.trim()
    );

    return true;
  } catch (error) {
    showLoginError("Format Project URL tidak valid: " + error.message);
    return false;
  }
}

/* =========================================
   LOGIN
========================================= */

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!supabaseClient) return;

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  $("loginButton").disabled = true;
  $("loginButton").textContent = "Memproses...";
  showLoginError("");

  try {
    const {data,error} = await supabaseClient.auth.signInWithPassword({
      email,password
    });

    if (error) throw error;

    await loadUserProfile(data.user);
  } catch(error) {
    showLoginError("Login gagal: " + error.message);
  } finally {
    $("loginButton").disabled = false;
    $("loginButton").textContent = "LOGIN";
  }
});

/* =========================================
   PROFIL PENGGUNA
========================================= */

async function loadUserProfile(user) {
  const {data:profile,error} = await supabaseClient
    .from("profiles")
    .select("full_name,role")
    .eq("id",user.id)
    .single();

  if (error || !profile) {
    await supabaseClient.auth.signOut();
    showLoginError(
      "Profil pengguna tidak ditemukan atau tidak dapat dibaca: " +
      (error?.message || "")
    );
    return;
  }

  currentProfile = profile;
  $("userName").textContent = profile.full_name || user.email;
  $("userRole").textContent = (profile.role || "staff").toUpperCase();

  $("loginPanel").style.display = "none";
  $("app").style.display = "block";

  await loadDashboardData();
  showPage("dashboard");
}


/* =========================================
   DATA SUPABASE
========================================= */

async function loadDashboardData() {
  $("pageContent").innerHTML =
    '<div class="empty">Mengambil data dari database...</div>';

  try {
    const [itemsResult, batchesResult] = await Promise.all([
      supabaseClient.from("items").select("*"),
      supabaseClient.from("stock_batches").select("*")
    ]);

    if (itemsResult.error) throw itemsResult.error;
    if (batchesResult.error) throw batchesResult.error;

    // Simpan data Master Barang
    itemsData = itemsResult.data || [];

    // Buat pencocokan berdasarkan ID barang
    const itemMap = Object.fromEntries(
      itemsData.map(item => [item.id, item])
    );

    // Gabungkan data batch dengan Master Barang
    batchesData = (batchesResult.data || []).map(batch => ({
      ...batch,
      item: itemMap[batch.item_id] || null,
      expiry: batch.expiry_date
    }));

    // Urutkan berdasarkan tanggal kedaluwarsa
    batchesData.sort((a, b) => {
      if (!a.expiry) return 1;
      if (!b.expiry) return -1;
      return new Date(a.expiry) - new Date(b.expiry);
    });

  } catch(error) {
    $("pageContent").innerHTML = `
      <div class="panel">
        <h3>Gagal membaca database</h3>
        <p class="muted">${escapeHTML(error.message)}</p>
        <button class="refresh-btn" onclick="refreshData()">
          Coba Lagi
        </button>
      </div>`;
    return false;
  }

  return true;
}


/* =========================================
   DASHBOARD
========================================= */

function renderDashboard() {
  const totalStock = batchesData.reduce((sum,batch) =>
    sum + Number(batch.quantity ?? 0),0
  );

  $("pageContent").innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Dashboard</h1>
        <p>Ringkasan persediaan farmasi</p>
      </div>
      <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
    </div>

    <div class="notice">
      Data dibaca dari database Supabase. Modul transaksi belum diaktifkan.
    </div>

    <div class="cards">
      <div class="stat-card">
        <div class="label">Master Barang</div>
        <div class="number">${formatNumber(itemsData.length)}</div>
      </div>
      <div class="stat-card">
        <div class="label">Jumlah Batch</div>
        <div class="number">${formatNumber(batchesData.length)}</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Kuantitas Batch</div>
        <div class="number">${formatNumber(totalStock)}</div>
      </div>
      <div class="stat-card">
        <div class="label">Status Sistem</div>
        <div class="number" style="font-size:20px;color:var(--green)">Terhubung</div>
      </div>
    </div>

    <div class="panel">
      <h3>Identitas Pengguna</h3>
      <p>${escapeHTML(currentProfile?.full_name)}</p>
      <p class="muted">Role: ${escapeHTML(currentProfile?.role)}</p>
    </div>

    <div class="panel">
      <h3>Master Barang Terbaru</h3>
      ${renderSimpleTable(itemsData.slice(0,10))}
    </div>
  `;
}

function renderSimpleTable(data) {
  if (!data.length) {
    return '<div class="empty">Belum ada data.</div>';
  }

  const cols = Object.keys(data[0]).slice(0,7);

  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${escapeHTML(c)}</th>`).join("")}</tr></thead>
        <tbody>
          ${data.map(row=>`
            <tr>${cols.map(c=>`<td>${escapeHTML(row[c])}</td>`).join("")}</tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* =========================================
   MASTER BARANG
========================================= */

function renderItems() {
  const isAdmin = currentProfile?.role === "admin";

  $("pageContent").innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Master Barang</h1>
        <p>Pengelolaan data master persediaan farmasi</p>
      </div>
      <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
    </div>

    ${isAdmin ? `
      <div class="panel">
        <h3 id="itemFormTitle">Tambah Barang Baru</h3>

        <form id="itemForm">
          <div class="form-grid">
            <div class="field">
              <label>Kode Barang</label>
              <input id="itemCode" maxlength="50" required placeholder="OB001">
            </div>
            <div class="field">
              <label>Nama Barang</label>
              <input id="itemName" maxlength="200" required placeholder="Nama barang">
            </div>
            <div class="field">
              <label>Kategori</label>
              <input id="itemCategory" maxlength="100" placeholder="Obat">
            </div>
            <div class="field">
              <label>Satuan</label>
              <input id="itemUnit" maxlength="30" required placeholder="Tablet">
            </div>
            <div class="field">
              <label>Stok Minimum</label>
              <input id="itemMinimum" type="number" min="0" step="0.01" value="0" required>
            </div>
          </div>

          <br>
          <button class="primary-btn" id="saveItemButton">Simpan Barang</button>
          <button type="button" class="refresh-btn" id="cancelItemEdit" style="display:none">Batal</button>
          <p id="itemMessage" class="muted"></p>
        </form>
      </div>
    ` : `
      <div class="notice">Akun Staff hanya dapat melihat data Master Barang.</div>
    `}

    <div class="panel">
      <h3>Daftar Barang (${itemsData.length})</h3>
      <input id="itemSearch" type="search" placeholder="Cari kode atau nama barang..."
        style="width:100%;max-width:400px;padding:11px;margin-bottom:15px;border:1px solid var(--border);border-radius:7px">
      <div id="itemsTable"></div>
    </div>
  `;

  renderItemsTableWithActions(itemsData);

  $("itemSearch").addEventListener("input",function(){
    const q = this.value.toLowerCase();
    renderItemsTableWithActions(itemsData.filter(item =>
      [item.item_code,item.item_name,item.category]
        .some(v=>String(v||"").toLowerCase().includes(q))
    ));
  });

  if (isAdmin) {
    $("itemForm").addEventListener("submit",saveItem);
    $("cancelItemEdit").addEventListener("click",resetItemForm);
  }
}

function renderItemsTableWithActions(data) {
  const container = $("itemsTable");
  const isAdmin = currentProfile?.role === "admin";

  if (!data.length) {
    container.innerHTML = '<div class="empty">Belum ada data barang yang sesuai.</div>';
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Kode</th><th>Nama Barang</th><th>Kategori</th>
            <th>Satuan</th><th>Stok Minimum</th><th>Status</th>
            ${isAdmin?"<th>Aksi</th>":""}
          </tr>
        </thead>
        <tbody>
          ${data.map(item=>`
            <tr>
              <td>${escapeHTML(item.item_code)}</td>
              <td>${escapeHTML(item.item_name)}</td>
              <td>${escapeHTML(item.category||"-")}</td>
              <td>${escapeHTML(item.unit)}</td>
              <td>${formatNumber(item.minimum_stock)}</td>
              <td>${item.is_active
                ?'<span class="status">Aktif</span>'
                :'<span class="status" style="background:#fce8e8;color:#a22">Nonaktif</span>'}
              </td>
              ${isAdmin?`
                <td>
                  <button class="action-btn" data-edit="${escapeHTML(item.id)}">Ubah</button>
                  <button class="action-btn" data-toggle="${escapeHTML(item.id)}">
                    ${item.is_active?"Nonaktifkan":"Aktifkan"}
                  </button>
                </td>`:""}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  container.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click",()=>editItem(btn.dataset.edit));
  });

  container.querySelectorAll("[data-toggle]").forEach(btn=>{
    btn.addEventListener("click",()=>toggleItem(btn.dataset.toggle));
  });
}

async function saveItem(event) {
  event.preventDefault();

  if (currentProfile?.role !== "admin") return;

  const message = $("itemMessage");
  const button = $("saveItemButton");

  const item = {
    item_code:$("itemCode").value.trim(),
    item_name:$("itemName").value.trim(),
    category:$("itemCategory").value.trim()||null,
    unit:$("itemUnit").value.trim(),
    minimum_stock:Number($("itemMinimum").value)
  };

  if (!item.item_code||!item.item_name||!item.unit) {
    message.textContent="Kode, nama, dan satuan wajib diisi.";
    return;
  }

  if (!Number.isFinite(item.minimum_stock)||item.minimum_stock<0) {
    message.textContent="Stok minimum harus angka nol atau lebih.";
    return;
  }

  button.disabled=true;
  button.textContent="Menyimpan...";

  try {
    let result;

    if (editingItemId) {
      result = await supabaseClient.from("items")
        .update(item).eq("id",editingItemId);
    } else {
      result = await supabaseClient.from("items").insert(item);
    }

    if (result.error) throw result.error;

    alert(editingItemId?"Perubahan berhasil disimpan.":"Barang berhasil ditambahkan.");
    editingItemId=null;
    await loadDashboardData();
    showPage("items");

  } catch(error) {
    message.textContent="Gagal menyimpan: "+error.message;
    button.disabled=false;
    button.textContent=editingItemId?"Simpan Perubahan":"Simpan Barang";
  }
}

function editItem(id) {
  const item=itemsData.find(x=>x.id===id);
  if (!item) return;

  editingItemId=id;
  $("itemCode").value=item.item_code||"";
  $("itemName").value=item.item_name||"";
  $("itemCategory").value=item.category||"";
  $("itemUnit").value=item.unit||"";
  $("itemMinimum").value=item.minimum_stock??0;

  $("itemFormTitle").textContent="Ubah Data Barang";
  $("saveItemButton").textContent="Simpan Perubahan";
  $("cancelItemEdit").style.display="inline-block";

  $("itemForm").scrollIntoView({behavior:"smooth"});
}

function resetItemForm() {
  editingItemId=null;
  $("itemForm").reset();
  $("itemMinimum").value=0;
  $("itemFormTitle").textContent="Tambah Barang Baru";
  $("saveItemButton").textContent="Simpan Barang";
  $("cancelItemEdit").style.display="none";
  $("itemMessage").textContent="";
}

async function toggleItem(id) {
  if (currentProfile?.role!=="admin") return;

  const item=itemsData.find(x=>x.id===id);
  if (!item) return;

  const nextStatus=!item.is_active;

  if (!confirm(`Yakin ingin ${nextStatus?"mengaktifkan":"menonaktifkan"} ${item.item_name}?`)) return;

  const {error}=await supabaseClient.from("items")
    .update({is_active:nextStatus}).eq("id",id);

  if (error) {
    alert("Gagal mengubah status: "+error.message);
    return;
  }

  await loadDashboardData();
  showPage("items");
}


/* =========================================
   STOK BATCH - VERSI BARU
========================================= */

function getBatchStatus(batch) {
  const qty = Number(batch.quantity || 0);

  if (batch.expiry) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const expiryDate = new Date(batch.expiry + "T00:00:00");

    if (!Number.isNaN(expiryDate.getTime())) {
      const diff = Math.ceil(
        (expiryDate - today) / (1000 * 60 * 60 * 24)
      );

      if (diff < 0) {
        return { key: "expired", label: "Kedaluwarsa" };
      }

      if (diff <= 90) {
        return { key: "near", label: "Segera Kedaluwarsa" };
      }
    }
  }

  if (qty <= 0) {
    return { key: "empty", label: "Stok Kosong" };
  }

  return { key: "available", label: "Tersedia" };
}

function formatExpiry(value) {
  if (!value) return "-";

  const date = new Date(value + "T00:00:00");

  if (Number.isNaN(date.getTime())) return "-";

  return date.toLocaleDateString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function renderBatches() {
  const totalStock = batchesData.reduce(
    (sum, batch) => sum + Number(batch.quantity || 0),
    0
  );

  const counts = {
    expired: 0,
    near: 0,
    empty: 0,
    available: 0
  };

  batchesData.forEach(batch => {
    const status = getBatchStatus(batch);
    counts[status.key]++;
  });

  $("pageContent").innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Stok per Batch</h1>
        <p>Monitoring persediaan berdasarkan nomor batch dan ED</p>
      </div>
      <button class="refresh-btn" onclick="refreshData()">
        ↻ Refresh
      </button>
    </div>

    <div class="cards">
      <div class="stat-card">
        <div class="label">Jumlah Batch</div>
        <div class="number">${formatNumber(batchesData.length)}</div>
      </div>

      <div class="stat-card">
        <div class="label">Total Kuantitas</div>
        <div class="number">${formatNumber(totalStock)}</div>
      </div>

      <div class="stat-card">
        <div class="label">Segera Kedaluwarsa</div>
        <div class="number" style="color:#b7791f">
          ${formatNumber(counts.near)}
        </div>
      </div>

      <div class="stat-card">
        <div class="label">Kedaluwarsa</div>
        <div class="number" style="color:var(--red)">
          ${formatNumber(counts.expired)}
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Daftar Stok per Batch</h3>

      <div class="form-grid" style="margin-bottom:18px">
        <div class="field">
          <label>Pencarian</label>
          <input
            id="batchSearch"
            type="search"
            placeholder="Nama barang, kode, atau nomor batch"
          >
        </div>

        <div class="field">
          <label>Filter Status</label>
          <select
            id="batchStatusFilter"
            style="width:100%;padding:11px;border:1px solid var(--border);border-radius:7px"
          >
            <option value="all">Semua Status</option>
            <option value="available">Tersedia</option>
            <option value="empty">Stok Kosong</option>
            <option value="near">Segera Kedaluwarsa</option>
            <option value="expired">Kedaluwarsa</option>
          </select>
        </div>
      </div>

      <div id="batchTable"></div>
    </div>
  `;

  function displayBatchTable() {
    const search = $("batchSearch").value.toLowerCase().trim();
    const filter = $("batchStatusFilter").value;

    const filtered = batchesData.filter(batch => {
      const item = batch.item || {};

      const searchText = [
        item.item_code,
        item.item_name,
        batch.batch_number
      ].join(" ").toLowerCase();

      const status = getBatchStatus(batch);

      return searchText.includes(search) &&
        (filter === "all" || status.key === filter);
    });

    if (!filtered.length) {
      $("batchTable").innerHTML = `
        <div class="empty">
          Tidak ada data batch yang sesuai.
        </div>
      `;
      return;
    }

    $("batchTable").innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>Kode Barang</th>
              <th>Nama Barang</th>
              <th>Nomor Batch</th>
              <th>ED</th>
              <th>Jumlah Stok</th>
              <th>Satuan</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>
            ${filtered.map((batch, index) => {
              const item = batch.item || {};
              const status = getBatchStatus(batch);

              let statusStyle = "";

              if (status.key === "expired") {
                statusStyle = "background:#fce8e8;color:#a22";
              } else if (status.key === "near") {
                statusStyle = "background:#fff3cd;color:#856404";
              } else if (status.key === "empty") {
                statusStyle = "background:#edf0f4;color:#596579";
              }

              return `
                <tr>
                  <td>${index + 1}</td>
                  <td>${escapeHTML(item.item_code || "-")}</td>
                  <td>${escapeHTML(item.item_name || "Barang tidak ditemukan")}</td>
                  <td>${escapeHTML(batch.batch_number || "-")}</td>
                  <td>${formatExpiry(batch.expiry)}</td>
                  <td><strong>${formatNumber(batch.quantity)}</strong></td>
                  <td>${escapeHTML(item.unit || "-")}</td>
                  <td>
                    <span class="status" style="${statusStyle}">
                      ${status.label}
                    </span>
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>

      <p class="muted" style="margin-top:12px">
        Menampilkan ${filtered.length} dari ${batchesData.length} batch.
        Batas peringatan kedaluwarsa: 90 hari.
      </p>
    `;
  }

  $("batchSearch").addEventListener("input", displayBatchTable);
  $("batchStatusFilter").addEventListener("change", displayBatchTable);

  displayBatchTable();
}


/* =========================================
   MENU PERSIAPAN
========================================= */

const futurePages={
  receipts:["Penerimaan Barang","Pencatatan barang masuk dari pemasok."],
  issues:["Pengeluaran Barang","Pencatatan barang keluar dan distribusi."],
  recap:["Rekap Pengeluaran","Laporan pengeluaran berdasarkan periode."],
  cards:["Kartu Stok","Riwayat mutasi dan saldo stok."],
  stocktake:["Stok Opname","Pencocokan stok fisik dengan sistem."],
  settings:["Pengaturan","Pengaturan pengguna dan sistem."]
};

function renderFuturePage(page) {
  const config=futurePages[page];

  $("pageContent").innerHTML=`
    <div class="page-heading">
      <div><h1>${config[0]}</h1><p>${config[1]}</p></div>
    </div>
    <div class="notice">
      Modul ini masih dalam tahap pengembangan. Transaksi belum dapat dilakukan.
    </div>
    <div class="panel">
      <h3>${config[0]}</h3>
      <div class="empty">Fitur akan diaktifkan setelah alur transaksi dan keamanan selesai disiapkan.</div>
    </div>
  `;
}

/* =========================================
   NAVIGASI
========================================= */

function showPage(page) {
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  if (page==="dashboard") renderDashboard();
  else if (page==="items") renderItems();
  else if (page==="batches") renderBatches();
  else if (futurePages[page]) renderFuturePage(page);
}

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>showPage(btn.dataset.page));
});

/* =========================================
   REFRESH
========================================= */

async function refreshData() {
  const ok=await loadDashboardData();
  if (ok) {
    const active=document.querySelector(".nav-btn.active")?.dataset.page||"dashboard";
    showPage(active);
  }
}

/* =========================================
   LOGOUT DAN SESSION
========================================= */

$("logoutButton").addEventListener("click",async()=>{
  await supabaseClient.auth.signOut();
  location.reload();
});

async function checkSession() {
  if (!initializeSupabase()) return;

  const {data,error}=await supabaseClient.auth.getSession();

  if (error) {
    showLoginError(error.message);
    return;
  }

  if (data.session) {
    await loadUserProfile(data.session.user);
  }
}

checkSession();

</script>
